# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Keep 1 warm instance running 24/7 to eliminate cold start delays
  minInstances: 1
  maxInstances: 2

env:
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: studio-5306701288-d19b1
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:581796544364:web:5c577736cc62792dc8fd49
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyD8eWxEjK57tndLBXYFxGCswYF47aHo080
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: studio-5306701288-d19b1.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: studio-5306701288-d19b1.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 581796544364
  # Web Push (FCM) VAPID public key – Firebase console → Project settings →
  # Cloud Messaging → Web configuration → Web Push certificates → Generate key pair.
  # It is a *public* key, so a plain value is fine. Uncomment and paste:
  # - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
  #   value: <public key pair string>
  #   availability: [BUILD, RUNTIME]
